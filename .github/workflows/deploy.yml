# main に push されるたびにビルドして GitHub Pages に公開する。
#
# 有効にするには、リポジトリの Settings > Pages で
# 「Source」を「GitHub Actions」に切り替える（一度だけ必要）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 「Actions」タブから手動でも実行できるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のものは中断せず、待ち行列は最新だけを残す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 壊れたものを公開しないよう、テストと型チェックを通してからビルドする
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
