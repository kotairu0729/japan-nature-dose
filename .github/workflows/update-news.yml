name: ニュース自動更新

on:
  schedule:
    - cron: '0 3 * * *'   # 毎日 12:00 JST (= 03:00 UTC)
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Google News RSS からニュースを取得
        run: python scripts/fetch_news.py

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "新しい記事はありませんでした"
          else
            git commit -m "chore: ニュース自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push origin main
          fi
